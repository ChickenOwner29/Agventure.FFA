<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - AgVenture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Welcome, <span id="studentName"></span>!</h1>

<h2>Your Tasks</h2>
<ul id="studentTasks"></ul>

<h2>Your Points: <span id="pointsDisplay">0</span></h2>

<button onclick="window.location.href='leaderboard.html'">View Leaderboard</button>

<script src="script.js"></script>
<script>
const studentName = localStorage.getItem("name");
let officerCode = localStorage.getItem("officerCode");

// If QR code provided officer code, use it
const urlParams = new URLSearchParams(window.location.search);
const officerFromQR = urlParams.get('officer');
if(officerFromQR) {
    officerCode = officerFromQR;
    localStorage.setItem("officerCode", officerCode);
}

document.getElementById("studentName").innerText = studentName;

function displayTasks() {
    const tasks = JSON.parse(localStorage.getItem("tasks") || "[]")
                  .filter(t => t.officerCode === officerCode);
    const uploads = JSON.parse(localStorage.getItem("uploads") || "{}");
    const studentUploads = uploads[studentName] || {};

    document.getElementById("studentTasks").innerHTML = tasks.map((task,index) => {
        const done = studentUploads[index] ? "text-decoration: line-through;" : "";
        return `<li style="${done}">
            <b>${task.title}</b> - ${task.desc} (${task.points} pts)
            <input type="file" accept="image/*" onchange="uploadPhoto(event, ${index})">
        </li>`;
    }).join('');

    updatePoints();
}

function uploadPhoto(event,index) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
        let uploads = JSON.parse(localStorage.getItem("uploads") || "{}");
        uploads[studentName] = uploads[studentName] || {};
        uploads[studentName][index] = reader.result;
        localStorage.setItem("uploads", JSON.stringify(uploads));

        // Update student points persistently
        let students = JSON.parse(localStorage.getItem("students") || "[]");
        let student = students.find(s => s.name === studentName && s.officerCode === officerCode);
        if(student){
            const tasks = JSON.parse(localStorage.getItem("tasks") || "[]")
                          .filter(t => t.officerCode === officerCode);
            student.points = Object.keys(uploads[studentName]).reduce((sum,i)=>sum+(tasks[i]?.points||0),0);
            localStorage.setItem("students", JSON.stringify(students));
        }

        displayTasks();
    }
    reader.readAsDataURL(file);
}

function updatePoints() {
    const students = JSON.parse(localStorage.getItem("students") || "[]");
    const student = students.find(s => s.name === studentName && s.officerCode === officerCode);
    document.getElementById("pointsDisplay").innerText = student ? student.points : 0;
}

displayTasks();
</script>
</body>
</html>
