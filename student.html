<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - AgVenture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome, <span id="studentName"></span>!</h1>

  <h2>Your Tasks</h2>
  <ul id="studentTasks"></ul>

  <h2>Your Points: <span id="pointsDisplay">0</span></h2>

  <script src="script.js"></script>
  <script>
    const studentName = localStorage.getItem("name");
    const officerCode = localStorage.getItem("officerCode");
    document.getElementById("studentName").innerText = studentName;

    const studentTasks = document.getElementById("studentTasks");

    // Get tasks linked to this officer
    const allTasks = JSON.parse(localStorage.getItem("tasks") || "[]");
    const tasks = allTasks.filter(t => t.officerCode === officerCode);

    // Display tasks
    studentTasks.innerHTML = tasks.map((task,index) => `
        <li>
          <b>${task.title}</b> - ${task.desc} (${task.points} pts)
          <input type="file" accept="image/*" onchange="uploadPhoto(event, ${index})">
        </li>
    `).join('');

    // Handle uploads
    function uploadPhoto(event,index) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function() {
            let uploads = JSON.parse(localStorage.getItem("uploads") || "{}");
            uploads[studentName] = uploads[studentName] || {};
            uploads[studentName][index] = reader.result; // store base64
            localStorage.setItem("uploads", JSON.stringify(uploads));
            alert("Photo uploaded!");
            updatePoints();
        }
        reader.readAsDataURL(file);
    }

    function updatePoints() {
        let uploads = JSON.parse(localStorage.getItem("uploads") || "{}");
        const studentUploads = uploads[studentName] || {};
        const points = Object.keys(studentUploads).reduce((sum, taskIndex) => {
            return sum + tasks[taskIndex].points;
        }, 0);
        document.getElementById("pointsDisplay").innerText = points;
    }

    updatePoints();
  </script>
</body>
</html>
