<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgVenture Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h1>AgVenture</h1>

    <input type="text" id="name" placeholder="Your Name">

    <!-- Grade selection (students only) -->
    <select id="grade">
      <option value="">Select Grade (students)</option>
      <option value="8th">8th Grade</option>
      <option value="7th">7th Grade</option>
      <option value="6th">6th Grade</option>
    </select>

    <input type="text" id="customCode" placeholder="Custom Class Code (officers only)">
    <input type="text" id="signupCode" placeholder="Class Code (students)">

    <select id="role">
      <option value="officer">Officer</option>
      <option value="student">Student</option>
    </select>

    <button onclick="login()">Login</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
