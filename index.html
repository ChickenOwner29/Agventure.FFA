<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AgVenture Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>AgVenture Login</h1>
    <form id="loginForm">
      <label>Name:<br><input type="text" id="name" required></label><br><br>
      
      <label>Role:<br>
        <select id="role" required>
          <option value="">Select role</option>
          <option value="officer">Officer</option>
          <option value="student">Student</option>
        </select>
      </label><br><br>
      
      <div id="gradeBox" style="display:none">
        <label>Grade:<br>
          <select id="grade">
            <option value="">Select grade</option>
            <option value="6">6th</option>
            <option value="7">7th</option>
            <option value="8">8th</option>
          </select>
        </label><br><br>
      </div>
      
      <label>Class Code:<br><input type="text" id="classCode" required></label><br><br>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
