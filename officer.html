<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Officer Dashboard - AgVenture</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Officer Dashboard</h1>
    <p>Class Code: <span id="classCodeDisplay"></span></p>

    <h2>Add Task</h2>
    <input type="text" id="taskTitle" placeholder="Task Name">
    <input type="number" id="taskPoints" placeholder="Points">
    <button onclick="addTask()">Add Task</button>

    <h2>Tasks</h2>
    <ul id="taskList"></ul>

    <h2>Student Photo Submissions</h2>
    <div id="photoSubmissions"></div>

    <h2>Leaderboard</h2>
    <ul id="grade6"></ul>
    <ul id="grade7"></ul>
    <ul id="grade8"></ul>
  </div>
</body>
</html>
