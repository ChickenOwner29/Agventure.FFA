<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officer Dashboard - AgVenture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Officer Dashboard</h1>
  <div>
    <input type="text" id="taskTitle" placeholder="Task Title">
    <textarea id="taskDesc" placeholder="Task Description"></textarea>
    <button onclick="createTask()">Add Task</button>
  </div>

  <h2>Existing Tasks</h2>
  <ul id="tasksList"></ul>

  <script src="script.js"></script>
  <script>
    const tasksList = document.getElementById("tasksList");

    function createTask() {
        const title = document.getElementById("taskTitle").value;
        const desc = document.getElementById("taskDesc").value;
        if (!title || !desc) return alert("Enter task title and description.");

        // Save task to local storage / Google Sheets API later
        let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
        tasks.push({ title, desc, points: 10 }); // default 10 points
        localStorage.setItem("tasks", JSON.stringify(tasks));
        displayTasks();
        document.getElementById("taskTitle").value = "";
        document.getElementById("taskDesc").value = "";
    }

    function displayTasks() {
        const tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
        tasksList.innerHTML = tasks.map((t, i) => `<li>${t.title} - ${t.desc}</li>`).join('');
    }

    displayTasks();
  </script>
</body>
</html>
