<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Officer Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Officer Dashboard</h1>

<h2>Class Code: <span id="classCodeDisplay"></span></h2>
<p>Students Registered: <span id="studentCount"></span></p>

<hr>

<h2>Add New Task</h2>
<input type="text" id="taskTitle" placeholder="Task name">
<input type="number" id="taskPoints" placeholder="Points">
<button onclick="addTask()">Add Task</button>

<h2>Current Tasks</h2>
<ul id="taskList"></ul>

<hr>

<h2>Student Photo Submissions</h2>
<div id="photoSubmissions"></div>

<br>
<a href="leaderboard.html">View Leaderboard</a>

<script src="script.js"></script>
</body>
</html>
