<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officer Dashboard - AgVenture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Officer Dashboard</h1>
  <p>Your student code: <b id="studentCodeDisplay"></b></p>

  <div>
    <input type="text" id="taskTitle" placeholder="Task Title">
    <textarea id="taskDesc" placeholder="Task Description"></textarea>
    <input type="number" id="taskPoints" placeholder="Points" value="10">
    <button onclick="createTask()">Add Task</button>
  </div>

  <h2>Existing Tasks</h2>
  <ul id="tasksList"></ul>

  <script src="script.js"></script>
  <script>
    const studentCode = localStorage.getItem("studentCode");
    document.getElementById("studentCodeDisplay").innerText = studentCode;

    const tasksList = document.getElementById("tasksList");

    function createTask() {
        const title = document.getElementById("taskTitle").value;
        const desc = document.getElementById("taskDesc").value;
        const points = parseInt(document.getElementById("taskPoints").value) || 10;
        if (!title || !desc) return alert("Enter task title and description.");

        let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
        tasks.push({
            title,
            desc,
            points,
            officerCode: studentCode
        });
        localStorage.setItem("tasks", JSON.stringify(tasks));
        displayTasks();
        document.getElementById("taskTitle").value = "";
        document.getElementById("taskDesc").value = "";
        document.getElementById("taskPoints").value = 10;
    }

    function displayTasks() {
        const tasks = JSON.parse(localStorage.getItem("tasks") || "[]")
            .filter(t => t.officerCode === studentCode);
        tasksList.innerHTML = tasks.map((t,i) =>
            `<li>${t.title} - ${t.desc} (${t.points} pts)</li>`).join('');
    }

    displayTasks();
  </script>
</body>
</html>
